# Netlify Configuration for AMIHIVE (Vite + React)

[build]
  # Command to run for building the production bundle
  command = "npm run build"
  # Directory containing the generated static files
  publish = "dist"

[build.environment]
  # Pin the build runtime and keep Vite available during Netlify installs.
  NODE_VERSION = "20.19.0"
  NPM_FLAGS = "--include=dev"

# Single Page App (SPA) redirect rule
# Ensures client-side routing works on page refreshes and direct links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control headers for immutable Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Standard security & content headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
